<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Genesee Co-op FCU pinwheel mark (recreated from brand logo) -->
  <g>
    <!-- petals: half-discs arranged in a circle, bulge facing outward -->
    <!-- angle 270 (top): blue -->
    <path d="M -9,0 A 9 9 0 0 1 9,0 Z" fill="#3F45E8" transform="translate(32,15) rotate(0)"/>
    <!-- angle 306: lavender -->
    <path d="M -8,0 A 8 8 0 0 1 8,0 Z" fill="#8D88E8" transform="translate(42,18.5) rotate(36)"/>
    <!-- angle 342: navy (large) -->
    <path d="M -9,0 A 9 9 0 0 1 9,0 Z" fill="#221D4D" transform="translate(48.2,26.7) rotate(72)"/>
    <!-- angle 18: slate -->
    <path d="M -8,0 A 8 8 0 0 1 8,0 Z" fill="#5A5570" transform="translate(48.2,37.3) rotate(108)"/>
    <!-- angle 54: dark green -->
    <path d="M -9,0 A 9 9 0 0 1 9,0 Z" fill="#1FA571" transform="translate(42,45.5) rotate(144)"/>
    <!-- angle 90 (bottom): teal -->
    <path d="M -8,0 A 8 8 0 0 1 8,0 Z" fill="#2FBE8C" transform="translate(32,49) rotate(180)"/>
    <!-- angle 126: red -->
    <path d="M -9,0 A 9 9 0 0 1 9,0 Z" fill="#F0533F" transform="translate(22,45.5) rotate(216)"/>
    <!-- angle 162: coral -->
    <path d="M -8,0 A 8 8 0 0 1 8,0 Z" fill="#F3745C" transform="translate(15.8,37.3) rotate(252)"/>
    <!-- angle 198: gold -->
    <path d="M -9,0 A 9 9 0 0 1 9,0 Z" fill="#E2AE1B" transform="translate(15.8,26.7) rotate(288)"/>
    <!-- angle 234: yellow -->
    <path d="M -8,0 A 8 8 0 0 1 8,0 Z" fill="#E9CE3F" transform="translate(22,18.5) rotate(324)"/>
    <!-- heads: navy dots at the outer ring -->
    <circle cx="44.5" cy="9.5" r="4.2" fill="#221D4D"/>
    <circle cx="57" cy="32" r="4.2" fill="#221D4D"/>
    <circle cx="44.5" cy="54.5" r="4.2" fill="#221D4D"/>
    <circle cx="19.5" cy="54.5" r="4.2" fill="#221D4D"/>
    <circle cx="7" cy="32" r="4.2" fill="#221D4D"/>
    <circle cx="19.5" cy="9.5" r="4.2" fill="#221D4D"/>
  </g>
</svg>
