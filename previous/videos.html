<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EWA Explainer Videos — Genesee Co-op FCU</title>
  <style>
    * { margin: 0; box-sizing: border-box; }
    body { background: #0f172a; color: #f8fafc; font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; padding: 32px 16px; }
    h1 { font-size: 22px; font-weight: 800; margin-bottom: 6px; }
    .sub { color: #94a3b8; font-size: 14px; margin-bottom: 40px; }
    .video-block { max-width: 420px; margin: 0 auto 48px; }
    .label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: #4ade80; margin-bottom: 8px; }
    h2 { font-size: 18px; font-weight: 700; margin-bottom: 14px; }
    video { width: 100%; border-radius: 16px; background: #000; display: block; box-shadow: 0 8px 32px rgba(0,0,0,.5); }
    .back { display: inline-block; margin-top: 32px; color: #64748b; font-size: 13px; text-decoration: none; }
    .back:hover { color: #94a3b8; }
    .center { text-align: center; }
  </style>
</head>
<body>
  <div class="center" style="margin-bottom:40px">
    <h1>EWA Explainer Videos</h1>
    <p class="sub">Educational videos by Genesee Co-op Federal Credit Union</p>
  </div>

  <div class="video-block">
    <div class="label">Video 1 · ~52 seconds</div>
    <h2>Why cash advance apps cost more than you think</h2>
    <video controls playsinline>
      <source src="explainer.mp4" type="video/mp4">
    </video>
  </div>

  <div class="video-block">
    <div class="label">Video 2 · ~57 seconds</div>
    <h2>Credit union line of credit vs. cash advance apps</h2>
    <video controls playsinline>
      <source src="explainer-loc.mp4" type="video/mp4">
    </video>
  </div>

  <div class="center">
    <a href="/ewa/" class="back">← Back to the demo app</a>
  </div>
</body>
</html>
